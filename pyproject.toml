[project]
name = "aion2-market"
version = "0.1.0"
description = "Local AION 2 Marketplace assistant: aion2.exchange API -> SQLite -> analysis -> PySide6 UI"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "pyqtgraph>=0.13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
